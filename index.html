<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hyana's homepage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" rel="stylesheet" integrity="sha384-55uQGdclWjXwWY0yHikdtcfcat9pPBqMBCVFIeWjRhvPPUYbpJLhIJegzTcFoh/A" crossorigin="anonymous">
<style>
:root {
  --page: #dfe9f3;
  --dot: #c9d9ea;
  --frame: #6f9fd3;
  --frame-dark: #3f6ea8;
  --panel: #ffffff;
  --line: #c8c8c8;
  --soft: #f4f7fb;
  --ink: #333333;
  --muted: #666666;
  --link: #2f5f99;
  --orange: #c24e00;
  --red: #c4262b;
  --tab: #3f6ea8;
  --pixel: 'Galmuri11', 'Gowun Dodum', monospace;
  --body: 'Gowun Dodum', 'Apple SD Gothic Neo', Dotum, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--page);
  background-image: radial-gradient(var(--dot) 1.5px, transparent 1.6px);
  background-size: 14px 14px;
  color: var(--ink);
  font: 12px/1.6 var(--body);
  padding: 28px 16px 40px;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }

.hompy { max-width: 920px; margin: 0 auto; position: relative; }

/* Top strip: counter, title, BGM */
.top { display: grid; grid-template-columns: 218px 1fr; gap: 0 12px; align-items: end; padding: 0 74px 6px 22px; }
.counter { font: 11px var(--pixel); color: var(--muted); letter-spacing: .02em; }
.counter b { color: var(--red); font-weight: 400; }
.counter i { font-style: normal; color: #444; }
.title-row { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.hompy-title { display: inline-flex; align-items: center; gap: 6px; font: 400 16px var(--pixel); letter-spacing: .02em; color: var(--frame-dark); margin: 0; }
.hompy-title .ico { width: 14px; height: 14px; margin: 0; vertical-align: 0; }
.hompy-url { font: 11px var(--pixel); color: var(--muted); }

.bgm {
  position: absolute; right: 74px; top: -24px;
  display: flex; align-items: center; gap: 8px;
  background: #fff; border: 1px solid var(--line); border-radius: 12px;
  padding: 2px 10px 2px 6px; width: 260px; font-size: 11px;
}
.bgm .note { color: var(--orange); font-weight: 800; }
.bgm .track { overflow: hidden; white-space: nowrap; flex: 1; }
.bgm .track span { display: inline-block; animation: marquee 12s linear infinite; }
.bgm button { border: 0; background: none; cursor: pointer; color: var(--frame-dark); padding: 0 2px; }
@keyframes marquee { 0%, 15% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

/* Frame */
.frame {
  position: relative;
  background: var(--frame);
  border-radius: 18px;
  padding: 12px;
  margin-right: 62px;
  box-shadow: 0 2px 0 var(--frame-dark);
}
.frame-inner {
  border: 2px dashed rgba(255,255,255,.75);
  border-radius: 12px;
  padding: 10px;
  display: grid;
  grid-template-columns: 206px 1fr;
  gap: 10px;
  min-height: 560px;
}
.panel { background: var(--panel); border: 1px solid #a9c3e0; border-radius: 10px; padding: 12px; }

/* Left panel */
.left { display: flex; flex-direction: column; gap: 10px; }
.mood { font-size: 11px; color: var(--muted); border-bottom: 1px dotted var(--line); padding-bottom: 6px; }
.mood b { color: var(--orange); font-weight: 700; }
.photo { width: 100%; aspect-ratio: 1; object-fit: cover; border: 1px solid var(--line); display: block; image-rendering: pixelated; }
.headline { font-size: 11.5px; color: #555; }
.left .rule { border-top: 1px dotted var(--line); }
.me { display: flex; align-items: center; gap: 8px; }
.me .mini { width: 26px; height: 36px; flex: none; }
.who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; }
.who small { width: 100%; color: var(--muted); font-size: 11px; }
.me b { color: var(--frame-dark); font-size: 13px; }
.me span { color: var(--muted); font-size: 11px; }
.sel { width: 100%; font: 11px var(--body); border: 1px solid var(--line); background: var(--soft); padding: 3px 4px; color: var(--ink); }

/* Right panel */
.right { display: flex; flex-direction: column; min-width: 0; }
.right-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--frame); padding-bottom: 6px; margin-bottom: 10px; }
.right-head h2 { margin: 0; font: 800 13px var(--body); color: var(--frame-dark); }
.right-head span { font-size: 11px; color: var(--muted); }

.news { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 14px; }
.box-title { font: 700 11px var(--body); color: var(--orange); margin: 0 0 4px; }
.news ul { list-style: none; margin: 0; padding: 0; }
.news li { display: flex; align-items: center; height: 24px; }
.news li .tag { flex: none; }
.news .box-title { height: 18px; line-height: 18px; }
.folders-box { border-left: 1px dotted var(--line); padding-left: 12px; }
.news li button { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink); }
.news li button:focus-visible { outline-offset: -2px; }
.news li button:hover { color: var(--link); text-decoration: underline; }
.tag { display: inline-block; font-size: 11px; color: #fff; background: var(--frame); border-radius: 2px; padding: 0 4px; margin-right: 4px; line-height: 15px; }
.tag.Project { background: #b84c00; } .tag.Craft { background: #2f7a42; } .tag.Team { background: #6b4fb0; }
.tag.Doc { background: #2f5f99; } .tag.On-call { background: #b3261e; } .tag.Fix { background: #6b6b6b; }
.counts { display: grid; grid-template-columns: 1fr auto; grid-auto-rows: 24px; align-items: center; align-content: start; margin: 0; }
.counts dt { color: #555; display: flex; align-items: center; } .counts dd { margin: 0; text-align: right; color: var(--muted); font-family: var(--pixel); }
.counts dd b { color: var(--orange); font-weight: 400; }

.room-wrap { margin-top: 12px; border: 1px solid var(--line); border-radius: 6px; background: linear-gradient(#f9fbff, #eef4fb); }
.room-wrap .label { font: 700 11px var(--body); color: var(--frame-dark); padding: 6px 10px 0; }
.room { display: block; width: 100%; height: auto; border-radius: 0 0 6px 6px; }


/* Tabs */
.tabs { position: absolute; right: -62px; top: 34px; display: flex; flex-direction: column; gap: 3px; }
.tabs button {
  width: 60px; padding: 7px 0; border: 0; border-radius: 0 7px 7px 0;
  background: var(--tab); color: #fff; font: 700 11px var(--body); cursor: pointer; text-align: center;
}
.tabs button:hover { background: #2f5a8f; }
.tabs button[aria-current="page"] { background: #fff; color: var(--frame-dark); border: 1px solid var(--frame); border-left: 0; }

/* Album */
.folders { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.folders button { border: 1px solid var(--line); background: var(--soft); padding: 2px 8px; font-size: 11px; cursor: pointer; border-radius: 2px; }
.folders button[aria-pressed="true"] { background: var(--frame-dark); color: #fff; border-color: var(--frame-dark); }
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pic { display: flex; flex-direction: column; justify-content: flex-start; border: 1px solid var(--line); padding: 6px 6px 8px; background: #fff; cursor: pointer; text-align: left; box-shadow: 1px 1px 0 #e5e5e5; }
.pic:hover { border-color: var(--frame); }
.pic .shot { aspect-ratio: 4/3; display: grid; place-items: center; text-align: center; padding: 6px; color: #fff; }
.pic .shot b { display: block; font-size: 26px; line-height: 1.1; }
.pic .shot small { display: block; font: 11px/1.3 var(--pixel); margin-top: 6px; }
.pic .shot { width: 100%; }
.pic .cap { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.8em; margin-top: 6px; font-weight: 700; font-size: 11.5px; line-height: 1.4; }
.pic .date { display: block; color: var(--muted); font-size: 11px; }
.shot.Project { background: linear-gradient(135deg, #ffb26b, #ff7a1a); }
.shot.Craft { background: linear-gradient(135deg, #8fd19e, #4c9a5e); }
.shot.Team { background: linear-gradient(135deg, #b7a2ea, #7b5fc0); }
.shot.Doc { background: linear-gradient(135deg, #9cc3ec, #4f7fbf); }
.shot.On-call { background: linear-gradient(135deg, #f0918d, #c9413c); }
.shot.Fix { background: linear-gradient(135deg, #c9c9c9, #8a8a8a); }
.skills { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 12px; }
.skills span, .skills button { border: 1px solid var(--line); background: var(--soft); border-radius: 10px; padding: 0 8px; font: 11px var(--pixel); color: #555; }
.skills button { cursor: pointer; color: var(--frame-dark); background: #fff; }
.skills button:hover { border-color: var(--frame); }
.history + .contacts, .skills + .contacts { margin-top: 0; }
.pager { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; margin-top: 12px; font: 12px var(--pixel); }
.pager button { min-width: 24px; height: 24px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; font: inherit; border-radius: 2px; }
.pager button:hover:not(:disabled) { border-color: var(--frame); color: var(--link); }
.pager button[aria-current="page"] { background: var(--frame-dark); border-color: var(--frame-dark); color: #fff; }
.pager button:disabled { color: var(--line); cursor: default; }
.ico { width: 12px; height: 12px; flex: none; vertical-align: -1px; margin-right: 4px; }
.line { display: inline-flex; align-items: center; }
.pic .shot .glyph { font: 22px/1.1 var(--pixel); letter-spacing: .02em; text-shadow: 1px 1px 0 rgba(0,0,0,.25); }
.tag.Hackathon { background: #8a6400; }
.shot.Hackathon { background: linear-gradient(135deg, #ffd66b, #d49a00); }
.tagrow button.more { border-style: dashed; color: var(--muted); }

/* Diary */
.post { border-bottom: 1px dotted var(--line); padding: 10px 0 12px; }
.post-date { font: 12px var(--pixel); color: var(--orange); }
.post-date span { color: var(--muted); margin-left: 6px; font-family: var(--body); font-size: 11px; }
.post h3 { margin: 2px 0 4px; font-size: 12.5px; color: var(--frame-dark); }
.post p { margin: 0 0 6px; }
.post .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: var(--soft); border-radius: 10px; padding: 0 8px; font-size: 11px; cursor: pointer; }
.chip:hover { border-color: var(--frame); color: var(--link); }

/* Board */
.board { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.board th { background: var(--soft); border-top: 2px solid var(--frame); border-bottom: 1px solid var(--line); padding: 5px 4px; font-weight: 700; color: #555; }
.board td { border-bottom: 1px dotted var(--line); padding: 5px 4px; }
.board td.n, .board td.d { color: var(--muted); text-align: center; white-space: nowrap; font-family: var(--pixel); font-size: 11px; }
.board td a { color: var(--ink); }
.board td button { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: var(--ink); }
.board td button:hover { color: var(--link); text-decoration: underline; }
.board .prize { color: var(--orange); font-weight: 700; }

/* Profile */
.prof p { margin: 0 0 8px; }
.history { list-style: none; margin: 0; padding: 0; }
.history li { display: grid; grid-template-columns: 150px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px dotted var(--line); }
.history .when { white-space: nowrap; font: 11px var(--pixel); color: var(--frame-dark); }
.history b { color: var(--ink); }

.foot { text-align: center; color: var(--muted); font-size: 11px; margin-top: 10px; padding-right: 62px; }
.foot b { color: var(--orange); font-weight: 400; font-family: var(--pixel); }

/* Popup window */
.pop[hidden] { display: none; }
.pop { position: fixed; inset: 0; background: rgba(40,60,90,.25); display: grid; place-items: center; padding: 16px; z-index: 10; }
.win { width: min(520px, 100%); max-height: 86vh; overflow: auto; background: #fff; border: 2px solid var(--frame-dark); border-radius: 4px; box-shadow: 4px 4px 0 rgba(0,0,0,.15); }
.win-bar { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; background: var(--frame-dark); color: #fff; padding: 4px 8px; font-weight: 700; font-size: 11.5px; }
.win-bar button { border: 1px solid #fff; background: none; color: #fff; width: 18px; height: 18px; line-height: 14px; padding: 0; cursor: pointer; font-size: 11px; }
.win-body { padding: 14px; }
.win-body h3 { margin: 0 0 2px; font-size: 14px; color: var(--frame-dark); }
.meta { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
.win-body ul { margin: 6px 0; padding-left: 16px; }
.contacts { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 11.5px; }
.photo-empty { width: 100%; aspect-ratio: 1; border: 1px dashed var(--line); background: var(--soft); display: grid; place-items: center; font-size: 40px; }

.lang { display: flex; justify-content: flex-end; gap: 2px; margin-bottom: -4px; }
.lang button { border: 1px solid var(--line); background: var(--soft); font-size: 11px; padding: 0 6px; cursor: pointer; border-radius: 2px; }
.lang button[aria-pressed="true"] { background: var(--frame-dark); color: #fff; border-color: var(--frame-dark); }
button.mood { display: block; width: 100%; text-align: left; padding: 0 0 6px; border-width: 0 0 1px; border-style: dotted; border-color: var(--line); background: none; cursor: pointer; }
button.mood:hover b { text-decoration: underline; }
.job { font-size: 11px; color: #666; }
.job span { color: var(--frame-dark); }
.nowbox { border: 1px dashed var(--line); background: var(--soft); padding: 6px 8px; font-size: 11px; }
.nowbox p { margin: 0 0 2px; } .nowbox b { color: var(--frame-dark); }
.shortcuts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.shortcuts button { border: 1px solid var(--line); background: #fff; font-size: 11px; padding: 4px 0; cursor: pointer; color: #666; }
.shortcuts button:hover { border-color: var(--frame); }
.shortcuts b { display: block; font: 15px var(--pixel); color: var(--orange); }
.counts dt button { display: inline-flex; align-items: center; border: 0; background: none; padding: 0; cursor: pointer; color: #555; font: inherit; }
.counts dt button:hover { color: var(--link); text-decoration: underline; }
.tagrow { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: -4px 0 10px; }
.tagrow span { font-size: 11px; color: var(--muted); margin-right: 2px; }
.tagrow button, .stackchip { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 0 7px; font: 11px var(--pixel); color: var(--frame-dark); cursor: pointer; }
.tagrow button[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: #fff; }
.tagrow button:hover, .stackchip:hover { border-color: var(--frame); }
.tchips { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 8px; }
.tchips i { font: normal 11px var(--pixel); background: rgba(0,0,0,.45); border-radius: 8px; padding: 0 6px; }
.stacks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.room .spot { fill: transparent; cursor: pointer; outline: none; }
.room .spot:hover, .room .spot:focus-visible { fill: rgba(255,255,255,.3); stroke: var(--orange); stroke-width: .6; }
.room-wrap .label span { font-weight: 400; color: var(--muted); margin-left: 8px; }
.cal { border: 1px solid var(--line); background: var(--soft); padding: 6px 8px 8px; margin: 0 auto 6px; max-width: 300px; }
.cal-head { display: flex; justify-content: space-between; align-items: center; font: 12px var(--pixel); color: var(--frame-dark); margin-bottom: 4px; }
.cal-head button { border: 0; background: none; cursor: pointer; color: var(--frame-dark); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font: 11px/20px var(--pixel); }
.cal-grid .dow { color: var(--muted); } .cal-grid .dow:first-child { color: var(--red); }
.cal-grid button.has { border: 0; padding: 0; background: var(--orange); color: #fff; border-radius: 50%; cursor: pointer; font: inherit; width: 20px; height: 20px; margin: 0 auto; }
.cal-grid .today { outline: 1px solid var(--frame); border-radius: 50%; }
.pop-photo { image-rendering: pixelated; width: 120px; aspect-ratio: 1; object-fit: cover; border: 1px solid var(--line); float: right; margin: 0 0 8px 10px; }

:focus-visible { outline: 2px solid var(--frame-dark); outline-offset: 2px; }
.tabs button:focus-visible { outline-color: #fff; outline-offset: -4px; }
.skip { position: absolute; left: 16px; top: -40px; background: #fff; color: var(--link); padding: 4px 10px; border: 2px solid var(--frame-dark); z-index: 20; }
.skip:focus { top: 4px; }
.surf { font-size: 11px; border: 1px solid var(--line); background: var(--soft); }
.surf summary { cursor: pointer; padding: 3px 6px; list-style: none; }
.surf summary::-webkit-details-marker { display: none; }
.surf summary::before { content: '▼ '; }
.surf[open] summary::before { content: '▲ '; }
.surf ul { list-style: none; margin: 0; padding: 2px 6px 6px; display: flex; flex-direction: column; gap: 2px; }
@media (prefers-reduced-motion: reduce) {
  .bgm .track span { animation: none !important; }
  html { scroll-behavior: auto; }
}

@media (max-width: 960px) {
  .news { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .folders-box { border-left: 0; padding: 6px 0 0; border-top: 1px dotted var(--line); }
  .counts { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
  .counts dd { margin-right: 10px; }
}

@media (max-width: 760px) {
  body { padding: 12px 16px 32px; }
  .top { grid-template-columns: 1fr; padding: 0 4px 6px; gap: 2px; }
  .bgm { position: static; width: auto; margin: 0 0 8px; }
  .frame { margin-right: 0; padding: 8px; }
  .frame-inner { grid-template-columns: 1fr; padding: 8px; }
  .headline { min-height: 0; }
  .photo, .photo-empty { max-width: 180px; margin: 0 auto; }
  .tabs { position: static; flex-direction: row; flex-wrap: wrap; margin-bottom: 6px; }
  .tabs button { width: auto; flex: 1; border-radius: 7px 7px 0 0; }
  .tabs button[aria-current="page"] { border: 1px solid var(--frame); border-bottom: 0; }
  .history li { grid-template-columns: 1fr; gap: 0; }
  .foot { padding-right: 0; }
}
</style>
</head>

/* Top strip */
const live = GOATCOUNTER && !['localhost', '127.0.0.1', ''].includes(location.hostname);
let counts = live ? ['…', '…'] : ['1', '∞'];
function renderCounter() {
  const note = live ? 'Visitor counts by GoatCounter. No cookies. Updates every few hours.' : 'Not a real counter yet. Nothing is tracked here.';
  $('counter').innerHTML = `<span title="${esc(t(note))}">TODAY <b>${esc(counts[0])}</b> <i>|</i> TOTAL <i>${esc(counts[1])}</i></span>`;
}
if (live) {
  const gc = document.createElement('script');
  gc.async = true;
  gc.src = 'https://gc.zgo.at/count.js';
  gc.dataset.goatcounter = `https://${GOATCOUNTER}.goatcounter.com/count`;
  document.head.append(gc);
  const base = `https://${GOATCOUNTER}.goatcounter.com/counter/TOTAL.json`;
  const today = new Date().toLocaleDateString('en-CA');
  const get = (url) => fetch(url).then((r) => (r.ok ? r.json() : { count: '0' })).then((j) => j.count).catch(() => '–');
  Promise.all([get(`${base}?start=${today}`), get(base)]).then((c) => { counts = c; renderCounter(); });
}

/* Mini-room: pixel art on a 160x90 grid */
const SPOTS = {
  window: [12, 7, 28, 22], notes: [46, 9, 22, 15], bookshelf: [128, 10, 26, 44], monitors: [70, 18, 42, 18],
  duck: [70, 35, 7, 6], mug: [103, 30, 7, 11], plant: [1, 36, 13, 18], me: [40, 45, 20, 28], cat: [61, 72, 11, 6], diploma: [113, 8, 13, 11], vr: [131, 4, 16, 6],
};
const SPOT_LABEL = {
  en: { window: 'Window', notes: 'Sticky notes: open the Diary', bookshelf: 'Bookshelf: open the Album', monitors: "Monitors: what I'm working on", duck: 'Rubber duck', mug: 'Coffee mug', plant: 'Plant', me: 'Me', cat: 'Cat', diploma: 'Diploma: education', vr: 'VR headset: before Handshake' },
  ko: { window: '창문', notes: '포스트잇: 다이어리 열기', bookshelf: '책장: 사진첩 열기', monitors: '모니터: 지금 하는 일', duck: '고무 오리', mug: '머그컵', plant: '화분', me: '나', cat: '고양이', diploma: '졸업장: 학력', vr: 'VR 헤드셋: Handshake 이전' },
};
const BUILT_IN_SPOTS = ['me', 'monitors', 'bookshelf', 'notes', 'diploma', 'vr'];
const roomText = (id) => { const r = D.room?.[id]; return (lang === 'ko' && r?.ko?.text && r.ko) || (r?.en?.text && r.en) || null; };
const activeSpots = () => Object.keys(SPOTS).filter((id) => BUILT_IN_SPOTS.includes(id) || roomText(id));
function room() {
  const R = [];
  const px = (x, y, w, h, c) => R.push(pxRect(x, y, w, h, c));
  const sprite = (x, y, rows, pal) => R.push(spriteRects(x, y, rows, pal));

  // Wall and baseboard
  px(0, 0, 160, 40, '#f1e4c6');
  for (let x = 4; x < 160; x += 8) px(x, 2, 1, 35, '#e7d7b4');
  px(0, 0, 160, 2, '#c9a77a');
  px(0, 37, 160, 3, '#9a6a3c'); px(0, 37, 160, 1, '#b9854f');

  // Wood floor
  for (let y = 40, r = 0; y < 90; y += 5, r++) {
    px(0, y, 160, 5, r % 2 ? '#c18749' : '#c98f55');
    px(0, y + 4, 160, 1, '#a8713d');
    for (let x = (r * 23) % 40; x < 160; x += 40) px(x, y, 1, 4, '#a8713d');
  }

  // Window
  px(12, 7, 28, 22, '#8a5a2b'); px(14, 9, 24, 18, '#9fd3f5'); px(14, 20, 24, 7, '#bfe3ff');
  px(31, 11, 3, 3, '#ffe066'); px(17, 12, 6, 2, '#fff'); px(19, 11, 3, 1, '#fff');
  px(25, 9, 2, 18, '#8a5a2b'); px(14, 17, 24, 2, '#8a5a2b'); px(10, 29, 32, 2, '#b9854f');

  // Sticky-note board
  px(46, 9, 22, 15, '#8a5a2b'); px(47, 10, 20, 13, '#d9a86c');
  [[49, 12, '#ffe066'], [56, 11, '#ff9fb0'], [61, 16, '#9fe0b0'], [50, 18, '#9fd3f5']].forEach(([x, y, c]) => {
    px(x, y, 5, 5, c); px(x + 1, y + 2, 3, 1, 'rgba(0,0,0,.18)'); px(x + 2, y, 1, 1, '#e5322d');
  });

  // Bookshelf
  px(128, 10, 26, 44, '#7d5530'); px(130, 12, 22, 40, '#5e3f22');
  const colors = ['#e5322d', '#3f6ea8', '#ffb000', '#5aa36b', '#8a6fc7', '#ff8c3a', '#f2f2f2'];
  [24, 37, 50].forEach((yb, s) => {
    px(130, yb, 22, 2, '#7d5530');
    let x = 131, i = s * 3;
    while (x < 149) {
      const w = 2 + (i % 2), h = 7 + ((i * 5) % 4);
      if (i % 5 === 4) x += 2;
      if (x + w > 151) break;
      px(x, yb - h, w, h, colors[i % colors.length]);
      px(x, yb - h + 2, w, 1, 'rgba(255,255,255,.35)');
      x += w; i++;
    }
  });

  // Desk
  px(66, 36, 56, 6, '#b9854f'); px(66, 36, 56, 1, '#d1a06a'); px(66, 42, 56, 2, '#8a5a2b');
  px(68, 44, 3, 14, '#7d5530'); px(117, 44, 3, 14, '#7d5530');
  px(100, 44, 16, 9, '#9a6a3c'); px(106, 48, 4, 1, '#5e3f22');

  // Two monitors with code
  [[70, false], [92, true]].forEach(([mx, term]) => {
    px(mx, 18, 20, 15, '#2b2b2b'); px(mx + 1, 19, 18, 12, term ? '#10151c' : '#1e2a3a');
    px(mx + 9, 33, 2, 3, '#444'); px(mx + 6, 35, 8, 1, '#444');
    const lines = term
      ? [[0, 6, '#7ee787'], [0, 11, '#7ee787'], [0, 4, '#8b949e'], [0, 9, '#7ee787'], [0, 2, '#f2f2f2']]
      : [[0, 7, '#ff7b72'], [2, 10, '#79c0ff'], [4, 6, '#d2a8ff'], [2, 12, '#a5d6ff'], [0, 3, '#ff7b72']];
    lines.forEach(([ind, len, c], k) => px(mx + 3 + ind, 21 + k * 2, len, 1, c));
  });

  // Desk items: rubber duck, keyboard, mouse, mug, succulent
  px(71, 38, 4, 2, '#ffd23f'); px(73, 36, 2, 2, '#ffd23f'); px(75, 37, 1, 1, '#ff8c3a'); px(73, 36, 1, 1, '#222');
  px(78, 38, 18, 3, '#d8d8d8'); for (let x = 79; x < 95; x += 2) px(x, 39, 1, 1, '#a0a0a0');
  px(98, 39, 2, 2, '#d8d8d8');
  px(104, 37, 4, 4, '#fff'); px(108, 38, 1, 2, '#fff'); px(104, 37, 4, 1, '#6b3e1e'); px(105, 33, 1, 2, 'rgba(255,255,255,.7)'); px(106, 31, 1, 2, 'rgba(255,255,255,.5)');
  px(114, 33, 5, 4, '#c9774b'); px(113, 30, 2, 3, '#5aa85a'); px(115, 28, 2, 5, '#6cbf6a'); px(117, 30, 2, 3, '#7fd07c');

  // Office chair seen from behind
  px(80, 46, 14, 11, '#2f5a8f'); px(81, 47, 12, 9, '#4f7fbf'); px(79, 56, 16, 3, '#2f5a8f');
  px(86, 59, 2, 5, '#444'); px(81, 64, 12, 1, '#444'); px(81, 65, 1, 1, '#222'); px(92, 65, 1, 1, '#222'); px(86, 65, 2, 1, '#222');

  // Corner plant
  sprite(2, 36, [
    '...gg..g....',
    '..gGg.gGg...',
    '.gGGggGGg.g.',
    'gGg.gGGg.gGg',
    '.g.gGgGgggG.',
    '..gGg.gGg...',
    '...g.gg.....',
  ], { g: '#4f9a52', G: '#7fd07c' });
  px(3, 43, 10, 2, '#b0603a'); px(4, 45, 8, 8, '#c9774b'); px(5, 46, 1, 6, '#dd8a5c');

  // Rug
  px(28, 63, 48, 20, '#e8a0aa'); px(26, 65, 52, 16, '#e8a0aa');
  px(30, 66, 44, 14, '#f4c6cc'); px(30, 72, 44, 2, '#e8a0aa');

  // Me: brown hair, sunglasses up, leather jacket, an apple
  px(42, 71, 16, 2, 'rgba(0,0,0,.18)');
  sprite(40, 45, ME.rows, ME.pal);

  // Cat napping on the rug
  sprite(62, 73, [
    '.c.c......',
    'cccccccc..',
    'cecdcdccc.',
    'cccccccccc',
    '.cccccccc.',
  ], { c: '#e89a4b', d: '#c47a33', e: '#5a3a1e' });

  // Diploma on the wall
  px(113, 8, 13, 11, '#c9a227'); px(114, 9, 11, 9, '#fffbe8');
  px(116, 11, 7, 1, '#9a8a6a'); px(116, 13, 5, 1, '#9a8a6a'); px(116, 15, 3, 1, '#9a8a6a');
  px(121, 14, 3, 3, '#c4262b'); px(121, 17, 1, 2, '#c4262b'); px(123, 17, 1, 2, '#9a1f22');

  // VR headset on top of the bookshelf
  px(131, 7, 2, 1, '#222'); px(145, 7, 2, 1, '#222');
  px(133, 5, 12, 5, '#3a3a46'); px(134, 6, 10, 3, '#55556a');
  px(135, 7, 3, 1, '#7d8fb5'); px(140, 7, 3, 1, '#7d8fb5'); px(133, 10, 12, 1, 'rgba(0,0,0,.2)');

  // Speech bubble
  px(36, 35, 28, 8, '#3f6ea8'); px(37, 36, 26, 6, '#fff'); px(49, 43, 3, 1, '#3f6ea8'); px(50, 42, 1, 1, '#fff'); px(50, 44, 1, 1, '#3f6ea8');

  const spots = activeSpots().map((id) => {
    const [x, y, w, h] = SPOTS[id];
    return `<rect class="spot" data-spot="${id}" x="${x}" y="${y}" width="${w}" height="${h}" tabindex="0" role="button" aria-label="${esc(SPOT_LABEL[lang][id])}"><title>${esc(SPOT_LABEL[lang][id])}</title></rect>`;
  }).join('');

  return `<svg class="room" viewBox="0 0 160 90" shape-rendering="crispEdges" role="group" aria-label="Pixel-art mini-room: a desk with two monitors showing code, a rubber duck and a coffee mug, a bookshelf, a window, a sticky-note board, a plant, a Smith College diploma, a VR headset, a cat napping on the rug, and ${esc(FIRST)} in a leather jacket holding an apple.">
    ${R.join('')}
    <text x="50" y="41" font-family="Galmuri11, monospace" font-size="5.5" fill="#3f6ea8" text-anchor="middle">${t('hello!')}</text>
    ${spots}
  </svg>`;
}

const tagFor = (skill) => ALL_TAGS.find((g) => g === tagName(skill));

  const kos = (lang === 'ko' && D.ko?.profile?.education) || [];

    return `<li><span class="when">${ed.start ? range(ed.start, ed.date) : ym(ed.date)}</span><span><b>${esc(e.school)}</b> · ${esc(e.place)}<br>${esc(e.degree)}<br>${esc(e.honors)}</span></li>`;

let cal = (posts[0]?.date || new Date().toLocaleDateString('en-CA')).slice(0, 7);
const views = {
  Home() {
    const yc = YEARS.map((y) => `<dt><button type="button" data-folder="${y}">${icon('folder')}${y}</button></dt><dd><b>${YEAR_COUNT.get(y)}</b></dd>`).join('');

      <p class="box-title">${t('History')}</p>
      <ul class="history">${[...D.chapters].reverse().map((c) => `
        <li><span class="when">${range(c.start, c.end)}</span><span><b>${esc(cTitle(c))}</b><br>${esc(L('chapters', c.id, 'summary', c.summary))}</span></li>`).join('')}</ul>
      ${education()}
      ${skills()}
      <div class="contacts">${P.contacts.map((c) => cLink(c)).join('')}</div>`;
  },
  Album() {
    const list = work.filter((e) => (album.year === 'All' || yearOf(e) === album.year) && (!album.tag || tagsOf(e).includes(album.tag)));
    const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
    album.page = Math.min(Math.max(1, album.page), pages);
    const shown = list.slice((album.page - 1) * PER_PAGE, album.page * PER_PAGE);
    return `
      <div class="right-head"><h2>${t('Album')}</h2><span>${list.length} ${t('photos')}</span></div>
      <div class="folders">${['All', ...YEARS].map((f) => `<button type="button" data-folder="${f}" aria-pressed="${f === album.year}">${icon('folder')}${t(f)}</button>`).join('')}</div>
      <div class="tagrow"><span>${t('Tags')}</span>${ALL_TAGS.filter((g) => album.allTags || TAG_COUNT.get(g) > 1 || g === album.tag).map((g) => `<button type="button" data-tag="${esc(g)}" aria-pressed="${g === album.tag}">#${esc(g)}</button>`).join('')}<button type="button" class="more" data-moretags="1" aria-expanded="${album.allTags}">${album.allTags ? t('fewer tags') : `${t('more tags')} +`}</button></div>
      <div class="album" id="album-grid">${shown.map((e) => `<button type="button" class="pic" data-entry="${e.id}">
          <span class="shot ${tagOf(e)}"><span><b class="glyph" aria-hidden="true">${esc(e.glyph || GLYPH[e.kind])}</b><span class="tchips">${tagsOf(e).map((g) => `<i>#${esc(g)}</i>`).join('')}</span></span></span>
          <span class="cap">${esc(eTitle(e))}${e.hack ? ` · ${esc(e.hack.team)}` : ''}</span><span class="date">${span(e)}</span></button>`).join('')}</div>
      ${pages > 1 ? `<nav class="pager" aria-label="${t('Album pages')}">
        <button type="button" data-page="${album.page - 1}" ${album.page === 1 ? 'disabled' : ''} aria-label="${t('Previous page')}">◀</button>
        ${Array.from({ length: pages }, (_, i) => i + 1).map((n) => `<button type="button" data-page="${n}"${n === album.page ? ' aria-current="page"' : ''}>${n}</button>`).join('')}
        <button type="button" data-page="${album.page + 1}" ${album.page === pages ? 'disabled' : ''} aria-label="${t('Next page')}">▶</button>
      </nav>` : ''}`;
  },
  Diary() {
    const list = posts.map((p) => {
      const k = ko('posts', p.id || p.date);
      return `
      <div class="post" id="post-${p.id || p.date}" data-date="${p.date}">
        <div class="post-date">${fullDate(p.date)}<span>${dayOf(p.date)}</span></div>
        <h3>${esc(k.title ?? p.title)}</h3>
        ${(k.body ?? p.body).map((x) => `<p>${esc(x)}</p>`).join('')}
      </div>`;
    }).join('');
    const log = D.changelog.map((c) => `<div class="post"><div class="post-date">${fullDate(c.date)}<span>${dayOf(c.date)} · ${t('site')} v${esc(c.version)}</span></div>${(ko('changelog', c.version).notes ?? c.notes).map((n) => `<p>${esc(n)}</p>`).join('')}</div>`).join('');
    return `<div class="right-head"><h2>${t('Diary')}</h2><span>${t('posts and site updates')}</span></div>${calendar()}${list}${log}`;
  },
  Board() {
    const rows = [
      ...P.contacts.map((c) => ({ cat: c.kind === 'email' ? t('Email') : t('Link'), cell: cLink(c), date: '' })),
    ];
    return `
      <div class="right-head"><h2>${t('Board')}</h2><span>${t('links')}</span></div>
      <table class="board"><thead><tr><th>${t('No.')}</th><th>${t('Title')}</th><th>${t('Type')}</th><th>${t('Date')}</th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr><td class="n">${rows.length - i}</td><td>${r.cell}</td><td class="d">${r.cat}</td><td class="d">${esc(r.date)}</td></tr>`).join('')}
      </tbody></table>`;
  },
};

function calendar() {
  const [y, m] = cal.split('-').map(Number);
  const first = new Date(y, m - 1, 1).getDay();
  const days = new Date(y, m, 0).getDate();
  const has = new Set([...posts.map((p) => p.date), ...D.changelog.map((c) => c.date)]);
  const today = new Date().toLocaleDateString('en-CA');
  const cells = [];
  for (let i = 0; i < first; i++) cells.push('<span></span>');
  for (let d = 1; d <= days; d++) {
    const date = `${cal}-${String(d).padStart(2, '0')}`;
    const cls = date === today ? ' today' : '';
    cells.push(has.has(date) ? `<button type="button" class="has${cls}" data-day="${date}" aria-label="${date}${lang === 'ko' ? ' 글 보기' : ', go to post'}">${d}</button>` : `<span class="${cls.trim()}">${d}</span>`);
  }
  return `<div class="cal">
    <div class="cal-head"><button type="button" data-cal="-1" aria-label="${t('Previous month')}">◀</button><b>${lang === 'ko' ? `${y}.${String(m).padStart(2, '0')}` : new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</b><button type="button" data-cal="1" aria-label="${t('Next month')}">▶</button></div>
    <div class="cal-grid" role="presentation">${DAYS[lang].map((d) => `<span class="dow">${d}</span>`).join('')}${cells.join('')}</div>
  </div>`;
}

let current = 'Home';
function renderTabs() {
  $('tabs').innerHTML = Object.keys(views).map((v) => `<button type="button" data-view="${v}"${v === current ? ' aria-current="page"' : ''}>${t(v)}</button>`).join('');
}
function show(view) {
  current = view;
  $('right').innerHTML = views[view]();
  document.querySelectorAll('#tabs [data-view]').forEach((b) => (b.dataset.view === view ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')));
}
function renderAll() {
  renderTop();
  renderTabs();
  renderLeft();
  show(current);
  const latest = D.changelog[0];
  $('foot').textContent = `${t('site')} v${latest.version} · ${t('updated')} ${fullDate(latest.date)}`;
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-view],[data-entry],[data-folder],[data-tag],[data-hack],[data-spot],[data-cal],[data-day],[data-lang],[data-mood],[data-moretags],[data-page]');
  if (!el) return;
  const d = el.dataset;
  if (!$('pop').hidden && (d.view || d.tag)) closeWin();
  if (d.view) {
    show(d.view);
    if (el.closest('#tabs') && matchMedia('(max-width: 760px)').matches) $('right').scrollIntoView({ behavior: SMOOTH, block: 'start' });
  } else if (d.page) {
    const y = window.scrollY;
    album.page = Number(d.page); show('Album');
    window.scrollTo(0, y);
    document.querySelector('.pager [aria-current="page"]')?.focus({ preventScroll: true });
  } else if (d.folder) { album.year = d.folder; album.page = 1; show('Album'); }
  else if (d.moretags) { album.allTags = !album.allTags; show('Album'); }
  else if (d.tag) { album.tag = album.tag === d.tag ? '' : d.tag; album.page = 1; show('Album'); }
  else if (d.entry) openEntry(byId[d.entry]);
  else if (d.hack) openHack(D.hackathons.find((h) => h.id === d.hack));
  else if (d.spot) openSpot(d.spot);
  else if (d.cal) {
    const [y, m] = cal.split('-').map(Number);
    const n = new Date(y, m - 1 + Number(d.cal), 1);
    cal = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}`;
    show('Diary');
  } else if (d.day) document.querySelector(`.post[data-date="${d.day}"]`)?.scrollIntoView({ behavior: SMOOTH, block: 'center' });
  else if (d.lang) {
    lang = d.lang;
    try { localStorage.setItem('lang', lang); } catch { /* storage blocked */ }
    renderAll();
  } else if (d.mood) { mood = (mood + 1) % MOODS.length; renderLeft(); }
});
document.addEventListener('keydown', (ev) => {
  const s = ev.target.closest?.('[data-spot]');
  if (s && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openSpot(s.dataset.spot); }
});

/* Popup */
let lastFocus;
function openWin(title, body) {
  lastFocus = document.activeElement;
  $('win-title').textContent = `■ ${title}`;
  $('win-body').innerHTML = body;
  $('pop').hidden = false;
  $('win-close').focus();
}
function closeWin() { $('pop').hidden = true; lastFocus?.focus(); }
$('win-close').onclick = closeWin;
$('pop').onclick = (ev) => { if (ev.target === $('pop')) closeWin(); };
document.addEventListener('keydown', (ev) => {
  if ($('pop').hidden) return;
  if (ev.key === 'Escape') return closeWin();
  if (ev.key !== 'Tab') return;
  const f = [...$('pop').querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])')];
  const first = f[0], last = f[f.length - 1];
  if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
});
function openEntry(e) {
  if (e.hack) return openHack(e.hack);
  openWin(t(tagOf(e)), `
    <h3>${esc(eTitle(e))}</h3>
    <div class="meta">${esc(eRole(e))} · ${span(e)}</div>
    <p>${esc(eSummary(e))}</p>
    <div class="stacks">${tagsOf(e).map((g) => `<button type="button" class="stackchip" data-tag="${esc(g)}" title="${t('Show only')}">#${esc(g)}</button>`).join('')}</div>`);
}
function openHack(h) {
  const k = ko('hackathons', h.id);
  openWin(t('Hackathon'), `
    <h3 class="line">${icon('trophy')}${esc(k.prize ?? h.prize)}</h3>
    <div class="meta">${esc(k.event ?? h.event)} ${esc(h.year)} · ${t('Team')} ${esc(h.team)}</div>
    <p>${esc(k.summary ?? h.summary)}</p>
    <div class="stacks">${byId[h.id].tags.map((g) => `<button type="button" class="stackchip" data-tag="${esc(g)}">#${esc(g)}</button>`).join('')}</div>`);
}
function openSpot(id) {
  if (id === 'bookshelf') { album = { year: 'All', tag: '', allTags: false, page: 1 }; return show('Album'); }
  if (id === 'notes') return show('Diary');
  if (id === 'diploma') return openWin(t('Education'), `<div class="prof">${education().replace(/<p class="box-title">.*?<\/p>/, '')}</div>`);
  if (id === 'vr') {
    const c = D.chapters.find((x) => x.id === 'asimula');
    return openWin(cShort(c), `<h3>${esc(cTitle(c))}</h3><div class="meta">${range(c.start, c.end)}</div><p>${esc(L('chapters', c.id, 'summary', c.summary))}</p>
      <button type="button" class="chip" data-entry="vr-concert-prototype">${esc(eTitle(byId['vr-concert-prototype']))}</button>`);
  }
  if (id === 'monitors') {
    return openWin(t("What I'm working on"), `<h3>${esc(cTitle(now))}</h3><p>${esc(L('chapters', now.id, 'summary', now.summary))}</p>
      <button type="button" class="chip" data-view="Album">${t('Open the Album')}</button>`);
  }
  if (id === 'me') {
    return openWin(t("That's me!"), `<img class="pop-photo" src="${AVATAR}" alt="${esc(lang === 'ko' ? `${P.name}의 픽셀 아트 초상화` : `Pixel-art portrait of ${P.name}`)}"><h3>${pName()}</h3>
      <div class="meta">${esc(P.pronouns)}${pf('pronounce') ? ` · ${t('say it')}: ${esc(pf('pronounce'))}` : ''}</div><p>${esc(pf('headline'))}</p>`);
  }
  const c = roomText(id);
  if (c) openWin(c.title, `<p>${esc(c.text)}</p>`);
}

renderAll();
</script>
</body>
</html>
